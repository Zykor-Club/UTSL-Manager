name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    # 项目是 Windows 专用（Avalonia 桌面 + user32/crypt32 P/Invoke），必须用 windows 运行器
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache TEdit source
        uses: actions/cache@v4
        with:
          path: third_party/TEdit
          # 缓存键只用脚本哈希：钉死的 commit 写在脚本里，改脚本自然会换键
          key: tedit-${{ hashFiles('scripts/get-tedit.ps1') }}

      - name: Fetch TEdit source (地图渲染依赖，钉死 commit)
        shell: pwsh
        # 管理器本体直接编译 TEdit 渲染核心（Maps\WorldMapRenderer.cs）：源码不入库
        # （third_party/ 已 gitignore），构建前必须先按脚本里钉死的 commit 取下来。
        run: ./scripts/get-tedit.ps1

      - name: Restore
        run: dotnet restore UTSLManager.Avalonia.csproj

      - name: Build
        run: dotnet build UTSLManager.Avalonia.csproj -c Release --no-restore

      - name: Publish
        # 不要用仓库默认的 PublishDir（会输出到仓库外），CI 里显式指到 publish/
        run: dotnet publish UTSLManager.Avalonia.csproj -c Release --no-build -p:PublishDir=${{ github.workspace }}/publish/

      - name: Publish agent (UTSLDaemon → publish/agent/)
        shell: pwsh
        # 「安装/更新云端 agent」按钮用的就是 publish/agent/UTSLDaemon.exe。
        # 必须是【自包含单文件】：被管机器通常没有 .NET 10（实测远端只有 .NET 9）。
        run: ./scripts/publish-agent.ps1 -ManagerDir "${{ github.workspace }}/publish"

      - name: Build extensions (官方扩展插件)
        # 扩展工程默认按相对路径找管理器 DLL；CI 里用 -p:ManagerDir 指到刚发布出来的目录
        run: |
          dotnet build extensions/PacketInspector/PacketInspector.csproj -c Release -p:ManagerDir=${{ github.workspace }}/publish
          dotnet build extensions/RuYouMusicPanel/RuYouMusicPanel.csproj -c Release -p:ManagerDir=${{ github.workspace }}/publish
          dotnet build extensions/ApiProbe/ApiProbe.csproj -c Release -p:ManagerDir=${{ github.workspace }}/publish
          dotnet build extensions/MapTemplates/MapTemplates.csproj -c Release -p:ManagerDir=${{ github.workspace }}/publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: UTSLManager-win-x64
          path: publish/
          if-no-files-found: error
